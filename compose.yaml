services:
  help-service:
    build: .
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - app-network


  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432'
  redis:
    image: 'redis:latest'
    ports:
      - '6379'

networks:
  app-network:
    driver: bridge